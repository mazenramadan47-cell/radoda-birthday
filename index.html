<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Something Special ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .screen {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    /* START SCREEN */

    #startScreen {
      flex-direction: column;
      background:
        radial-gradient(circle at center, #25101d 0%, #080808 45%, #000 100%);
    }

    #startScreen h1 {
      font-size: clamp(32px, 8vw, 65px);
      margin: 0 0 15px;
      letter-spacing: 2px;
    }

    #startScreen p {
      font-size: clamp(16px, 4vw, 22px);
      opacity: 0.75;
      margin-bottom: 35px;
    }

    #startButton {
      border: 1px solid rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.08);
      color: white;
      padding: 15px 35px;
      border-radius: 50px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
      backdrop-filter: blur(10px);
    }

    #startButton:hover {
      background: rgba(255,255,255,0.18);
      transform: scale(1.05);
    }

    /* COUNTDOWN */

    #countdownScreen {
      display: none;
      flex-direction: column;
      background: #000;
    }

    #countdown {
      font-size: clamp(80px, 20vw, 180px);
      font-weight: bold;
      animation: countdownAnimation 1s ease;
    }

    #countdownText {
      font-size: 18px;
      opacity: 0.6;
    }

    @keyframes countdownAnimation {
      0% {
        transform: scale(1.5);
        opacity: 0;
      }

      50% {
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* MEMORY SCREEN */

    #memoryScreen {
      display: none;
      flex-direction: column;
      background: #000;
    }

    .photo-container {
      position: relative;
      width: min(90vw, 650px);
      height: min(72vh, 700px);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #memoryPhoto {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 18px;
      box-shadow: 0 0 45px rgba(255,255,255,0.18);
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    #memoryText {
      position: absolute;
      bottom: -45px;
      left: 0;
      right: 0;
      font-size: 15px;
      opacity: 0.55;
    }

    /* FINAL */

    #finalScreen {
      display: none;
      flex-direction: column;
      padding: 30px;
      background:
        radial-gradient(circle at center, #2a0d19 0%, #090909 50%, #000 100%);
    }

    #finalScreen h1 {
      font-size: clamp(40px, 10vw, 80px);
      margin: 0 0 20px;
    }

    #finalScreen p {
      max-width: 600px;
      line-height: 1.8;
      font-size: clamp(17px, 4vw, 23px);
      opacity: 0.85;
    }

    .heart {
      font-size: 55px;
      margin-bottom: 20px;
      animation: heartbeat 1.5s infinite;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.15);
      }
    }

    .fadeIn {
      animation: fadeIn 1.5s ease forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.96);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>

<body>

  <!-- START -->

  <div id="startScreen" class="screen">

    <h1>Hey ❤️</h1>

    <p>
      I made something special for you...
    </p>

    <button id="startButton">
      Open Your Surprise ✨
    </button>

  </div>


  <!-- COUNTDOWN -->

  <div id="countdownScreen" class="screen">

    <div id="countdown">3</div>

    <div id="countdownText">
      Get ready...
    </div>

  </div>


  <!-- PHOTOS -->

  <div id="memoryScreen" class="screen">

    <div class="photo-container">

      <img
        id="memoryPhoto"
        src="01.JPG"
        alt="Memory"
      >

      <div id="memoryText">
        A little piece of our memories ❤️
      </div>

    </div>

  </div>


  <!-- FINAL -->

  <div id="finalScreen" class="screen">

    <div class="heart">
      ❤️
    </div>

    <h1>Happy Birthday!</h1>

    <p>
      I hope this little surprise made you smile.
      <br>
      Here's to all the beautiful memories we've made
      and all the ones still waiting for us.
      <br><br>
      ❤️
    </p>

  </div>


  <script>

    /* =========================
       YOUR PHOTOS
    ========================= */

    const photos = [
      "01.JPG",
      "02.JPG",
      "03.JPG",
      "04.JPG",
      "05.JPG",
      "06.JPG"
    ];


    /* =========================
       ELEMENTS
    ========================= */

    const startScreen =
      document.getElementById("startScreen");

    const countdownScreen =
      document.getElementById("countdownScreen");

    const memoryScreen =
      document.getElementById("memoryScreen");

    const finalScreen =
      document.getElementById("finalScreen");

    const startButton =
      document.getElementById("startButton");

    const countdown =
      document.getElementById("countdown");

    const photo =
      document.getElementById("memoryPhoto");


    /* =========================
       START SURPRISE
    ========================= */

    startButton.addEventListener("click", function () {

      startScreen.style.display = "none";

      countdownScreen.style.display = "flex";

      startCountdown();

    });


    /* =========================
       COUNTDOWN
    ========================= */

    function startCountdown() {

      let number = 3;

      countdown.textContent = number;

      const timer = setInterval(function () {

        number--;

        if (number > 0) {

          countdown.textContent = number;

          countdown.style.animation = "none";

          void countdown.offsetWidth;

          countdown.style.animation =
            "countdownAnimation 1s ease";

        }

        else {

          clearInterval(timer);

          countdown.textContent = "❤️";

          setTimeout(function () {

            countdownScreen.style.display = "none";

            startMemories();

          }, 1000);

        }

      }, 1000);

    }


    /* =========================
       SHOW MEMORIES
    ========================= */

    function startMemories() {

      memoryScreen.style.display = "flex";

      let currentPhoto = 0;

      showPhoto(currentPhoto);


      const photoTimer = setInterval(function () {

        currentPhoto++;

        if (currentPhoto >= photos.length) {

          clearInterval(photoTimer);

          setTimeout(function () {

            memoryScreen.style.display = "none";

            finalScreen.style.display = "flex";

            finalScreen.classList.add("fadeIn");

          }, 1500);

          return;

        }

        showPhoto(currentPhoto);

      }, 4000);

    }


    /* =========================
       PHOTO TRANSITION
    ========================= */

    function showPhoto(index) {

      photo.style.opacity = "0";

      setTimeout(function () {

        photo.src = photos[index];

        photo.onload = function () {

          photo.style.opacity = "1";

        };

      }, 700);

    }

  </script>

</body>
</html>
